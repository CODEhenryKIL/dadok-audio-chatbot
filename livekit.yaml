port: 7880
bind_addresses:
  - 127.0.0.1
rtc:
  # RTC TCP does not honor bind_addresses; keep this experiment on loopback UDP.
  tcp_port: 0
  udp_port: 7882
  node_ip: 127.0.0.1
  use_external_ip: false
  enable_loopback_candidate: true
  ips:
    includes:
      - 127.0.0.1/32
logging:
  level: warn
